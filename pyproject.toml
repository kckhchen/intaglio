[project]
name = "intaglio"
version = "1.4.0" # x-release-please-version
description = "Turn your Obsidian vault into a Jekyll site"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kckhchen" }]
keywords = ["obsidian", "jekyll", "markdown", "static-site-generator", "blogging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "python-frontmatter>=1.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/kckhchen/intaglio"
Issues = "https://github.com/kckhchen/intaglio/issues"

[project.scripts]
intaglio = "src.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
